name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/ -q

  docker:
    needs: lint-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t atlas-api:ci .
      - run: docker build -f Dockerfile.gpu -t atlas-api-gpu:ci .
      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push images
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        run: |
          docker tag atlas-api:ci ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api:${{ github.sha }}
          docker tag atlas-api:ci ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api:latest
          docker tag atlas-api-gpu:ci ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api-gpu:${{ github.sha }}
          docker tag atlas-api-gpu:ci ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api-gpu:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api-gpu:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api-gpu:latest
